basePath: /v1
definitions:
  main.LoginRequest:
    description: User login request structure
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  main.ShoppingList:
    description: Shopping list with items
    properties:
      id:
        example: 1001
        type: integer
      items:
        example:
        - milk
        - eggs
        - bread
        items:
          type: string
        type: array
      name:
        example: Grocery List
        type: string
    type: object
  main.ShoppingListPatchRequest:
    description: Partial shopping list update structure
    properties:
      items:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  main.ShoppingListPushRequest:
    description: Request body for pushing items onto a list
    properties:
      items:
        items:
          type: string
        type: array
    type: object
host: localhost:8888
info:
  contact: {}
  description: An API for managing shopping lists
  title: Shopping List API
  version: "0.1"
paths:
  /lists:
    get:
      description: Get all shopping lists for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ShoppingList'
            type: array
        "401":
          description: Unauthorzed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List all shopping lists
      tags:
      - lists
    post:
      consumes:
      - application/json
      description: Create a new shopping list with the provided data
      parameters:
      - description: Shopping list data
        in: body
        name: list
        required: true
        schema:
          $ref: '#/definitions/main.ShoppingList'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.ShoppingList'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new shopping list
      tags:
      - lists
  /lists/{id}:
    delete:
      description: Delete a shopping list by its ID
      parameters:
      - description: Shopping list ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Shopping list not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a shopping list
      tags:
      - lists
    get:
      description: Retrieve a shopping list by its ID with caching support
      parameters:
      - description: Shopping list ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ShoppingList'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Shopping list not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get a shopping list by ID
      tags:
      - lists
    patch:
      consumes:
      - application/json
      description: Update specific fields of a shopping list (partial update)
      parameters:
      - description: Shopping list ID
        in: path
        name: id
        required: true
        type: string
      - description: Partial shopping list data
        in: body
        name: patch
        required: true
        schema:
          $ref: '#/definitions/main.ShoppingListPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ShoppingList'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Shopping list not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Partially update a shopping list
      tags:
      - lists
    put:
      consumes:
      - application/json
      description: Update a shopping list with new data (full replacement)
      parameters:
      - description: Shopping list ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated shopping list data
        in: body
        name: list
        required: true
        schema:
          $ref: '#/definitions/main.ShoppingList'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ShoppingList'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Shopping list not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a shopping list
      tags:
      - lists
  /lists/{id}/push:
    post:
      consumes:
      - application/json
      description: Add a new item to an existing shopping list
      parameters:
      - description: Shopping list ID
        in: path
        name: id
        required: true
        type: string
      - description: Items to add to the list
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/main.ShoppingListPushRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ShoppingList'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Shopping list not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Add an item to a shopping list
      tags:
      - lists
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials and return a session token
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/main.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: User login
      tags:
      - authentication
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
